[tool.poetry]
classifiers = [
    "Development Status :: 4 - Beta",
]

[[tool.poetry.source]]
name = "private"
url = "http://a.source.too.secret/simple"
priority = "supplemental"

[tool.poetry.dependencies]
python = "^3.9"
private-package = { version = "^1.0", source = "private" }
requests = "^2.0"
httpx = { version = "^0.23", python = "^3.9" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "simple-project"
description = "Test project for poetry-plugin-migrate"
license = "MIT"
keywords = ["we", "just", "need", "some", "keywords"]
version = "1.2.3"
dynamic = [
    "classifiers",
    "dependencies",
]
readme = "README.md"
authors = [
    {name = "Dev Guy", email = "dev.guy@example.com"},
    {name = "Test Guy", email = "test.guy@example.com"},
]
maintainers = [
    {name = "Maintainer One", email = "maintainer.one@example.com"},
]
requires-python = '>=3.9,<4.0'

[project.urls]
homepage = "https://example.com/"
repository = "https://github.com/zyf722/poetry-plugin-migrate"

[project.scripts]
main = "simple_project.__main__:main"
