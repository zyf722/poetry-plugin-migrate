name: Publish and Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview the release without creating a pull request?"
        type: boolean
        required: true
        default: true
      bump-version:
        description: "Bump level"
        type: choice
        options:
          - "auto"
          - "major"
          - "minor"
          - "patch"
          - "prerelease"
        required: false
        default: "auto"
      as-prerelease:
        description: "Release as a pre-release?"
        type: boolean
        required: true
        default: false
      resume-version:
        description: "Resume publishing an existing version (for example, 0.2.0)"
        type: string
        required: false
        default: ""
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "pyproject.toml"
      - "CHANGELOG.md"

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'prepare' || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release pull request
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.resume-version == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Verify release branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Releases must be prepared from main, not $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: poetry

      - name: Set Poetry environment
        run: poetry env use '${{ steps.python.outputs.python-path }}'

      - name: Install dependencies
        run: poetry install

      - name: Run project checks
        run: poetry run poe check

      - name: Calculate and apply version
        id: version
        shell: bash
        run: |
          version_args=()
          bump="${{ inputs.bump-version }}"

          case "$bump" in
            auto) ;;
            major|minor|patch) version_args+=("--$bump") ;;
            prerelease) version_args+=("--prerelease") ;;
            *) echo "Unsupported bump level: $bump" >&2; exit 1 ;;
          esac

          if [[ "${{ inputs.as-prerelease }}" == "true" ]]; then
            version_args+=("--as-prerelease")
          fi

          next_version="$(poetry run semantic-release version --print "${version_args[@]}")"
          if [[ -z "$next_version" ]]; then
            echo "No releasable changes were found." >&2
            exit 1
          fi

          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          poetry run semantic-release version \
            --no-commit \
            --no-tag \
            --no-push \
            --no-vcs-release \
            --skip-build \
            "${version_args[@]}"

      - name: Build and validate distributions
        run: |
          poetry build
          poetry publish --dry-run

      - name: Show dry-run result
        if: ${{ inputs.dry-run }}
        run: |
          git diff --check
          git diff -- pyproject.toml CHANGELOG.md

      - name: Create release pull request
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="release/v$VERSION"
          if gh pr list --state open --base main --head "$branch" --json number --jq 'length' | grep -qx 0; then
            git switch -c "$branch"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml CHANGELOG.md
            git commit -m "chore(release): v$VERSION"
            git push --set-upstream origin "$branch"
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(release): v$VERSION" \
              --body "Automated release preparation for v$VERSION."
            gh workflow run build.yml --ref "$branch"
          else
            echo "An open release pull request already exists for v$VERSION." >&2
            exit 1
          fi

  publish:
    name: Publish merged release
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.user.login == 'github-actions[bot]' &&
        startsWith(github.event.pull_request.head.ref, 'release/v') &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'workflow_dispatch' &&
        inputs.resume-version != ''
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/poetry-plugin-migrate
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Resolve release source
        id: source
        shell: bash
        env:
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          RESUME_VERSION: ${{ inputs.resume-version }}
        run: |
          if [[ -n "$RESUME_VERSION" ]]; then
            if [[ "$GITHUB_REF_NAME" != "main" ]]; then
              echo "Releases must be resumed from main, not $GITHUB_REF_NAME." >&2
              exit 1
            fi
            if [[ ! "$RESUME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version: $RESUME_VERSION" >&2
              exit 1
            fi
            echo "ref=refs/tags/$RESUME_VERSION" >> "$GITHUB_OUTPUT"
            echo "version=$RESUME_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$MERGE_COMMIT" >> "$GITHUB_OUTPUT"
            echo "version=${RELEASE_BRANCH#release/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: poetry

      - name: Set Poetry environment
        run: poetry env use '${{ steps.python.outputs.python-path }}'

      - name: Install dependencies
        run: poetry install

      - name: Verify release version
        id: version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.source.outputs.version }}
        run: |
          version="$(poetry version --short)"

          if [[ "$version" != "$EXPECTED_VERSION" ]]; then
            echo "Project version $version does not match expected version $EXPECTED_VERSION." >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$version"; then
            tag_commit="$(git rev-list -n 1 "$version")"
            release_commit="$(git rev-parse HEAD)"
            if [[ "$tag_commit" != "$release_commit" ]]; then
              echo "Tag $version points to $tag_commit instead of release commit $release_commit." >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run project checks
        run: poetry run poe check

      - name: Build distributions
        run: poetry build

      - name: Create tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/$VERSION"; then
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Create GitHub release and upload distributions
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git switch --force-create main HEAD
          poetry run semantic-release changelog --post-to-release-tag "$VERSION"
          gh release upload "$VERSION" dist/* --clobber

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
