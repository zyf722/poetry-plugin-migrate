name: Publish and Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry Run?'
        type: boolean
        required: true
        default: true
      bump-version:
        description: 'Bump Level?'
        type: choice
        options:
          - 'auto'
          - 'major'
          - 'minor'
          - 'patch'
          - 'prerelease'
        required: false
        default: 'auto'
      as-prerelease:
        description: 'As pre-release?'
        type: boolean
        required: true
        default: false

jobs:
  publish:
    name: Publish and Release (${{ github.event.inputs.dry-run == 'true' && 'Dry Run' || 'Prod' }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/poetry-plugin-migrate
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history

      - name: Install Poetry
        run: |
          pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: poetry

      - name: Set Poetry environment
        run: |
          poetry env use python

      - name: Install dependencies
        run: poetry install

      - name: Verify release branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Releases must run from main, not $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Run project checks
        run: poetry run poe check

      - name: Semantic Release - Versioning
        shell: bash
        run: |
          global_args=()
          version_args=()
          bump="${{ github.event.inputs.bump-version }}"

          case "$bump" in
            auto) ;;
            major|minor|patch) version_args+=("--$bump") ;;
            prerelease) version_args+=("--prerelease") ;;
            *) echo "Unsupported bump level: $bump" >&2; exit 1 ;;
          esac

          if [[ "${{ github.event.inputs.as-prerelease }}" == "true" ]]; then
            version_args+=("--as-prerelease")
          fi

          if [[ "${{ github.event.inputs.dry-run }}" == "true" ]]; then
            global_args+=("-vv" "--noop")
          fi

          poetry run semantic-release "${global_args[@]}" version "${version_args[@]}"

      - name: Build distributions
        run: poetry build

      - name: Validate a dry-run publication
        if: ${{ github.event.inputs.dry-run == 'true' }}
        run: poetry publish --dry-run

      - name: Publish to PyPI with Trusted Publishing
        if: ${{ github.event.inputs.dry-run != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Semantic Release - Assets
        shell: bash
        run: |
          global_args=()
          if [[ "${{ github.event.inputs.dry-run }}" == "true" ]]; then
            global_args+=("-vv" "--noop")
          fi

          poetry run semantic-release "${global_args[@]}" publish
